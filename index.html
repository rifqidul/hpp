<!doctype html>
<html lang="id">
<head>

<title>HPP Studio — Food Cost Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>body{margin:0;background:#f5f3ef;color:#1b1d1a;font:14px/1.45 system-ui}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#17211d;color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{font-weight:800;font-size:20px}.brand small{display:block;color:#9fb5a8;font-size:11px;font-weight:500}.nav{display:grid;gap:6px}.nav button,.btn{border:1px solid #e3e0d9;background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer}.nav button{background:transparent;color:#b8c8bf;border:0;text-align:left}.nav button.active,.nav button:hover{background:#24352e;color:#fff}.main{padding:24px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.topbar h1{margin:0;font-size:28px}.topbar p{margin:4px 0;color:#72756f}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid #e3e0d9;border-radius:14px;padding:18px}.kpi{font-size:26px;font-weight:800}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#72756f;font-weight:700}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}.table-wrap{overflow:auto;border:1px solid #e3e0d9;border-radius:12px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:11px 12px;border-bottom:1px solid #e3e0d9;text-align:left;white-space:nowrap}.table th{font-size:11px;color:#72756f;background:#fbfaf8}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:#72756f;font-weight:600}.field input,.field select{width:100%;padding:10px;border:1px solid #e3e0d9;border-radius:8px;box-sizing:border-box}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.primary{background:#1f6b4f;color:#fff;border-color:#1f6b4f}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#d8eadd;color:#1f6b4f}.empty{padding:32px;text-align:center;color:#72756f}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-box{width:min(420px,100%);background:#fff;border:1px solid #e3e0d9;border-radius:16px;padding:26px}.drawer{position:fixed;inset:0;background:#0003;display:none;align-items:flex-end;justify-content:flex-end}.drawer.open{display:flex}.drawer-panel{height:100%;width:min(600px,100%);background:#fff;padding:22px;overflow:auto}.metric-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed #e3e0d9}.notice{background:#f0f7f2;border:1px solid #d8eadf;color:#315841;padding:12px;border-radius:10px}.hide{display:none!important}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:8;flex-direction:row;align-items:center;overflow:auto}.nav{display:flex}.main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:620px){.stats,.form-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}}</style>
</head><body>
<div id="authView" class="auth"><div class="auth-box"><div class="brand" style="color:#17211d">HPP Studio<small style="color:#72756f">Food Cost Management</small></div><div id="authNotice" class="notice" style="margin:14px 0">Masuk atau buat akun untuk mulai.</div><div class="grid"><div class="field"><label>Email</label><input id="authEmail" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="authPassword" type="password" autocomplete="new-password"></div><div class="actions"><button type="button" class="btn" id="signupBtn">Daftar</button><button type="button" class="btn primary" id="loginBtn">Masuk</button></div></div></div></div>
<div id="appView" class="app hide"><aside class="sidebar"><div class="brand">HPP Studio<small>Food Cost Management</small></div><div class="nav" id="nav"></div><div style="margin-top:auto;color:#9fb5a8;font-size:12px"><div id="orgLabel">Belum ada organisasi</div><button id="logoutBtn" class="btn" style="margin-top:8px">Keluar</button></div></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle"></p></div><div id="topActions"></div></div><div id="content"></div></main></div><div id="drawer" class="drawer"><div class="drawer-panel"><div class="topbar"><div><h2 id="drawerTitle" style="margin:0"></h2><p id="drawerSubtitle"></p></div><button type="button" class="btn" onclick="closeDrawer()">Tutup</button></div><div id="drawerContent"></div></div></div>
<script>
(function(){
  const authNotice=document.getElementById('authNotice'),signupBtn=document.getElementById('signupBtn'),loginBtn=document.getElementById('loginBtn');
  function setAuthError(message){authNotice.textContent=message;authNotice.style.background='#fff2f1';authNotice.style.borderColor='#f2c5c2';authNotice.style.color='#8e2d28'}
  function setAuthOk(message){authNotice.textContent=message;authNotice.style.background='#f0f7f2';authNotice.style.borderColor='#d8eadf';authNotice.style.color='#315841'}
  function initApp(){
    if(!window.supabase||typeof window.supabase.createClient!=='function'){setAuthError('Modul login gagal dimuat. Muat ulang halaman atau coba browser lain.');signupBtn.disabled=true;loginBtn.disabled=true;return;}
    const SUPABASE_URL='https://zcctezdfuyyhgjeajlpr.supabase.co',SUPABASE_KEY='sb_publishable_dgjPe3SZd1dgktnAXUxMEg_ITl9TihV';
    const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const state={session:null,org:null,units:[],ingredients:[],prices:[],recipes:[],recipeItems:[],menu:[],menuPrices:[],screen:'dashboard'};
    const navItems=[['dashboard','Dashboard'],['ingredients','Ingredients'],['recipes','Recipe Builder'],['calculator','HPP Calculator'],['menu','Menu Engineering'],['stock','Stock Opname'],['sales','Sales']];
    const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0)),fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:4});
    const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const $=id=>document.getElementById(id);
    function toast(m){setAuthOk(m)}
    window.closeDrawer=()=>$('drawer').classList.remove('open');
    window.openDrawer=(t,s,h)=>{$('drawerTitle').textContent=t;$('drawerSubtitle').textContent=s||'';$('drawerContent').innerHTML=h;$('drawer').classList.add('open')};
    function renderNav(){$('nav').innerHTML=navItems.map(([id,t])=>`<button type="button" class="${state.screen===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}
    async function loadOrg(){const {data,error}=await db.from('memberships').select('organization_id,role,organizations(id,name,currency_code,costing_method)').eq('user_id',state.session.user.id);if(error)throw error;state.org=data?.[0]?.organizations||null;$('orgLabel').textContent=state.org?.name||'Belum ada organisasi';if(!state.org){openOrgDrawer();return false}return true}
    async function createOrg(){try{const name=$('orgName').value.trim();if(!name)throw Error('Nama usaha wajib diisi');const {data,error}=await db.from('organizations').insert({name}).select().single();if(error)throw error;const m=await db.from('memberships').insert({organization_id:data.id,user_id:state.session.user.id,role:'owner'});if(m.error)throw m.error;await db.from('units').insert([['gram','g','mass',1],['kilogram','kg','mass',1000],['milliliter','ml','volume',1],['liter','L','volume',1000],['piece','pcs','count',1]].map(x=>({organization_id:data.id,name:x[0],symbol:x[1],base_unit:x[2],conversion_to_base:x[3]})));closeDrawer();await refresh()}catch(e){toast(e.message)}} window.createOrg=createOrg;
    async function loadData(){const o=state.org.id;const [u,i,p,r,ri,m,mp]=await Promise.all([db.from('units').select('*').eq('organization_id',o).order('name'),db.from('ingredients').select('*,units(symbol)').eq('organization_id',o).order('name'),db.from('ingredient_prices').select('*').eq('organization_id',o).order('effective_date',{ascending:false}),db.from('recipes').select('*,units(symbol)').eq('organization_id',o).order('name'),db.from('recipe_ingredients').select('*'),db.from('menu_items').select('*').eq('organization_id',o).order('name'),db.from('menu_prices').select('*')]);state.units=u.data||[];state.ingredients=i.data||[];state.prices=p.data||[];state.recipes=r.data||[];state.recipeItems=ri.data||[];state.menu=m.data||[];state.menuPrices=mp.data||[]}
    function unitCostForIngredient(id){const p=state.prices.find(x=>x.ingredient_id===id);if(!p)return 0;const pu=state.units.find(x=>x.id===p.purchase_unit_id),ing=state.ingredients.find(x=>x.id===id),bu=state.units.find(x=>x.id===ing?.base_unit_id);const qty=Number(p.purchase_qty)*(pu?.conversion_to_base||1)/(bu?.conversion_to_base||1);return qty?Number(p.purchase_cost)/qty:0}
    function recipeCost(id){return state.recipeItems.filter(x=>x.recipe_id===id).reduce((s,it)=>{if(!it.ingredient_id)return s;const ing=state.ingredients.find(i=>i.id===it.ingredient_id),u=state.units.find(x=>x.id===it.unit_id),bu=state.units.find(x=>x.id===ing?.base_unit_id),q=Number(it.quantity)*(u?.conversion_to_base||1)/(bu?.conversion_to_base||1);return s+q*unitCostForIngredient(it.ingredient_id)},0)}
    window.go=screen=>{state.screen=screen;renderNav();renderScreen()};
    function renderScreen(){const titles={dashboard:['Dashboard','Ringkasan HPP dan profitabilitas'],ingredients:['Ingredients','Master bahan baku dan histori harga'],recipes:['Recipe Builder','Bangun recipe dari bahan baku'],calculator:['HPP Calculator','Hitung HPP, food cost, dan margin'],menu:['Menu Engineering','Bandingkan harga, HPP, dan margin menu'],stock:['Stock Opname','Catat stok aktual dan variance'],sales:['Sales','Input penjualan dan gross profit']};$('pageTitle').textContent=titles[state.screen][0];$('pageSubtitle').textContent=titles[state.screen][1];$('topActions').innerHTML=state.screen==='ingredients'?'<button type="button" class="btn primary" onclick="openIngredientDrawer()">+ Bahan</button>':state.screen==='recipes'?'<button type="button" class="btn primary" onclick="openRecipeDrawer()">+ Recipe</button>':state.screen==='menu'?'<button type="button" class="btn primary" onclick="openMenuDrawer()">+ Menu</button>':'';$('content').innerHTML=screenHtml();if(state.screen==='stock')addOpRow();if(state.screen==='sales')addSaleRow()}
    function screenHtml(){if(state.screen==='dashboard')return `<div class="grid stats"><div class="card"><div class="label">Menu</div><div class="kpi">${state.menu.length}</div></div><div class="card"><div class="label">Ingredients</div><div class="kpi">${state.ingredients.length}</div></div><div class="card"><div class="label">Recipe</div><div class="kpi">${state.recipes.length}</div></div><div class="card"><div class="label">Avg HPP</div><div class="kpi">${money(state.menu.length?state.menu.reduce((s,m)=>s+recipeCost(m.recipe_id),0)/state.menu.length:0)}</div></div></div>`;if(state.screen==='ingredients')return `<div class="card"><div style="display:flex;justify-content:space-between"><h2>Ingredients</h2><span class="pill">${state.ingredients.length} item</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Unit</th><th>Unit Cost</th><th>Harga Terakhir</th></tr></thead><tbody>${state.ingredients.length?state.ingredients.map(i=>{const p=state.prices.find(x=>x.ingredient_id===i.id),u=state.units.find(x=>x.id===i.base_unit_id);return `<tr><td>${esc(i.name)}</td><td>${esc(u?.symbol||'')}</td><td>${money(unitCostForIngredient(i.id))}</td><td>${p?money(p.purchase_cost):'—'}</td></tr>`}).join(''):'<tr><td colspan="4" class="empty">Belum ada bahan.</td></tr>'}</tbody></table></div></div>`;if(state.screen==='recipes')return `<div class="card"><div style="display:flex;justify-content:space-between"><h2>Recipes</h2><span class="pill">${state.recipes.length}</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Recipe</th><th>Yield</th><th>Waste</th><th>HPP</th></tr></thead><tbody>${state.recipes.length?state.recipes.map(r=>`<tr><td>${esc(r.name)}</td><td>${fmt(r.yield_qty)} ${esc(r.units?.symbol||'')}</td><td>${fmt(r.waste_percent)}%</td><td>${money(recipeCost(r.id)*(1+Number(r.waste_percent||0)/100))}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">Belum ada recipe.</td></tr>'}</tbody></table></div></div>`;if(state.screen==='calculator')return `<div class="split"><div class="card"><h2>Calculator</h2><div class="form-grid"><div class="field full"><label>Recipe</label><select id="calcRecipe"><option value="">Pilih</option>${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Harga Jual</label><input id="calcPrice" type="number" value="30000"></div><div class="field"><label>Waste %</label><input id="calcWaste" type="number" value="0"></div></div><div class="actions"><button type="button" class="btn primary" onclick="runCalculator()">Hitung</button></div></div><div id="calcResult" class="card empty">Pilih recipe lalu hitung.</div></div>`;if(state.screen==='menu')return `<div class="card"><h2>Menu Engineering</h2><div class="table-wrap"><table class="table"><thead><tr><th>Menu</th><th>HPP</th><th>Harga</th><th>Food Cost</th><th>Gross Profit</th></tr></thead><tbody>${state.menu.length?state.menu.map(m=>{const h=recipeCost(m.recipe_id),p=state.menuPrices.find(x=>x.menu_item_id===m.id),fc=p?100*h/p.selling_price:0,gp=p?p.selling_price-h:0;return `<tr><td>${esc(m.name)}</td><td>${money(h)}</td><td>${p?money(p.selling_price):'—'}</td><td>${p?fmt(fc)+'%':'—'}</td><td>${p?money(gp):'—'}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">Belum ada menu.</td></tr>'}</tbody></table></div></div>`;if(state.screen==='stock')return `<div class="split"><div class="card"><h2>Stock Opname</h2><div class="form-grid"><div class="field"><label>Tanggal</label><input id="opDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Catatan</label><input id="opNote"></div></div><div id="opRows" style="margin-top:12px"></div><button type="button" class="btn" onclick="addOpRow()">+ Tambah bahan</button><div class="actions"><button type="button" class="btn primary" onclick="saveOpname()">Simpan</button></div></div><div class="card"><h2>Variance</h2><p>Bandingkan stok sistem dengan hitung fisik.</p></div></div>`;return `<div class="split"><div class="card"><h2>Input Sales</h2><div class="form-grid"><div class="field"><label>Tanggal</label><input id="saleDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Sumber</label><select id="saleSource"><option>manual</option><option>POS</option><option>import</option></select></div></div><div id="saleRows" style="margin-top:12px"></div><button type="button" class="btn" onclick="addSaleRow()">+ Tambah menu</button><div class="actions"><button type="button" class="btn primary" onclick="saveSale()">Simpan</button></div></div><div class="card"><h2>Preview</h2><div id="salePreview" class="empty">Tambahkan item.</div></div></div>`}
    window.runCalculator=()=>{const r=state.recipes.find(x=>x.id===$('calcRecipe').value);if(!r)return;const base=recipeCost(r.id),w=Number($('calcWaste').value||0),hpp=base*(1+w/100),price=Number($('calcPrice').value||0),fc=price?hpp/price*100:0;$('calcResult').innerHTML=`<div class="label">Final HPP</div><div class="kpi">${money(hpp)}</div><div class="metric-row"><span>Ingredient Cost</span><b>${money(base)}</b></div><div class="metric-row"><span>Food Cost</span><b>${fmt(fc)}%</b></div><div class="metric-row"><span>Gross Profit</span><b>${money(price-hpp)}</b></div>`};
    function openOrgDrawer(){openDrawer('Buat organisasi','Workspace pertama',`<div class="field"><label>Nama usaha</label><input id="orgName"></div><div class="actions"><button type="button" class="btn primary" onclick="createOrg()">Buat Workspace</button></div>`)}
    window.openIngredientDrawer=()=>openDrawer('Tambah Ingredient','Bahan dan harga terbaru',`<div class="form-grid"><div class="field"><label>Nama</label><input id="ingName"></div><div class="field"><label>Unit dasar</label><select id="ingUnit">${state.units.map(u=>`<option value="${u.id}">${esc(u.symbol)}</option>`).join('')}</select></div><div class="field"><label>Harga beli</label><input id="ingCost" type="number"></div><div class="field"><label>Qty beli</label><input id="ingQty" type="number" value="1"></div><div class="field"><label>Unit beli</label><select id="ingPurchaseUnit">${state.units.map(u=>`<option value="${u.id}">${esc(u.symbol)}</option>`).join('')}</select></div></div><div class="actions"><button type="button" class="btn primary" onclick="saveIngredient()">Simpan</button></div>`);
    window.saveIngredient=async()=>{try{const o={organization_id:state.org.id,name:$('ingName').value.trim(),base_unit_id:$('ingUnit').value};if(!o.name)throw Error('Nama wajib diisi');const {data,error}=await db.from('ingredients').insert(o).select().single();if(error)throw error;const p=await db.from('ingredient_prices').insert({organization_id:state.org.id,ingredient_id:data.id,purchase_qty:Number($('ingQty').value||1),purchase_unit_id:$('ingPurchaseUnit').value,purchase_cost:Number($('ingCost').value||0)});if(p.error)throw p.error;closeDrawer();await refresh();go('ingredients');toast('Ingredient tersimpan')}catch(e){toast(e.message)}};
    window.openRecipeDrawer=()=>{openDrawer('Buat Recipe','Bangun recipe dari bahan',`<div class="form-grid"><div class="field full"><label>Nama</label><input id="recName"></div><div class="field"><label>Yield</label><input id="recYield" type="number" value="1"></div><div class="field"><label>Unit</label><select id="recYieldUnit">${state.units.map(u=>`<option value="${u.id}">${esc(u.symbol)}</option>`).join('')}</select></div><div class="field"><label>Waste %</label><input id="recWaste" type="number" value="0"></div><div class="field full"><div id="recipeRows"></div><button type="button" class="btn" onclick="addRecipeRow()">+ Item</button></div></div><div class="actions"><button type="button" class="btn primary" onclick="saveRecipe()">Simpan</button></div>`);addRecipeRow()};
    window.addRecipeRow=()=>{const w=$('recipeRows');if(!w)return;const d=document.createElement('div');d.style.cssText='display:grid;grid-template-columns:1fr 100px 100px auto;gap:8px;margin-bottom:8px';d.innerHTML=`<select class="rr-item">${state.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select><input class="rr-qty" type="number" value="1"><select class="rr-unit">${state.units.map(u=>`<option value="${u.id}">${esc(u.symbol)}</option>`).join('')}</select><button type="button" class="btn" onclick="this.parentElement.remove()">×</button>`;w.appendChild(d)};
    window.saveRecipe=async()=>{try{const {data,error}=await db.from('recipes').insert({organization_id:state.org.id,name:$('recName').value.trim(),yield_qty:Number($('recYield').value||1),yield_unit_id:$('recYieldUnit').value,waste_percent:Number($('recWaste').value||0)}).select().single();if(error)throw error;const rows=[...document.querySelectorAll('#recipeRows>div')].map((x,i)=>({recipe_id:data.id,ingredient_id:x.querySelector('.rr-item').value,quantity:Number(x.querySelector('.rr-qty').value),unit_id:x.querySelector('.rr-unit').value,sort_order:i}));if(rows.length){const er=await db.from('recipe_ingredients').insert(rows);if(er.error)throw er.error}closeDrawer();await refresh();go('recipes');toast('Recipe tersimpan')}catch(e){toast(e.message)}};
    window.openMenuDrawer=()=>openDrawer('Tambah Menu','Hubungkan menu dengan recipe',`<div class="form-grid"><div class="field full"><label>Nama</label><input id="menuName"></div><div class="field full"><label>Recipe</label><select id="menuRecipe">${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Kategori</label><input id="menuCategory"></div><div class="field"><label>Harga Jual</label><input id="menuPrice" type="number"></div></div><div class="actions"><button type="button" class="btn primary" onclick="saveMenu()">Simpan</button></div>`);
    window.saveMenu=async()=>{try{const {data,error}=await db.from('menu_items').insert({organization_id:state.org.id,name:$('menuName').value.trim(),recipe_id:$('menuRecipe').value,category:$('menuCategory').value||null}).select().single();if(error)throw error;const p=await db.from('menu_prices').insert({menu_item_id:data.id,selling_price:Number($('menuPrice').value||0)});if(p.error)throw p.error;closeDrawer();await refresh();go('menu');toast('Menu tersimpan')}catch(e){toast(e.message)}};
    function addOpRow(){const w=$('opRows');if(!w)return;const d=document.createElement('div');d.style.cssText='display:grid;grid-template-columns:1.5fr .7fr .7fr auto;gap:8px;margin-bottom:8px';d.innerHTML=`<select class="op-ing">${state.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select><input class="op-system" type="number" value="0"><input class="op-counted" type="number" value="0"><button type="button" class="btn" onclick="this.parentElement.remove()">×</button>`;w.appendChild(d)}window.addOpRow=addOpRow;
    window.saveOpname=async()=>{try{const {data,error}=await db.from('stock_opnames').insert({organization_id:state.org.id,opname_date:$('opDate').value,notes:$('opNote').value||null}).select().single();if(error)throw error;const rows=[...document.querySelectorAll('#opRows>div')].map(x=>{const id=x.querySelector('.op-ing').value,ing=state.ingredients.find(i=>i.id===id);return {opname_id:data.id,ingredient_id:id,system_qty:Number(x.querySelector('.op-system').value||0),counted_qty:Number(x.querySelector('.op-counted').value||0),unit_id:ing.base_unit_id,unit_cost:unitCostForIngredient(id)}});if(rows.length){const er=await db.from('stock_opname_items').insert(rows);if(er.error)throw er.error}toast('Stock opname tersimpan')}catch(e){toast(e.message)}};
    function addSaleRow(){const w=$('saleRows');if(!w)return;const d=document.createElement('div');d.style.cssText='display:grid;grid-template-columns:1.5fr .6fr .8fr auto;gap:8px;margin-bottom:8px';d.innerHTML=`<select class="sale-menu">${state.menu.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select><input class="sale-qty" type="number" min="1" value="1"><input class="sale-price" type="number" min="0" placeholder="Harga"><button type="button" class="btn" onclick="this.parentElement.remove();previewSales()">×</button>`;['change','input'].forEach(ev=>{d.querySelector('.sale-menu').addEventListener(ev,previewSales);d.querySelector('.sale-qty').addEventListener(ev,previewSales);d.querySelector('.sale-price').addEventListener(ev,previewSales)});w.appendChild(d);previewSales()}window.addSaleRow=addSaleRow;
    function previewSales(){const rows=[...document.querySelectorAll('#saleRows>div')];let total=0,gp=0;rows.forEach(x=>{const m=state.menu.find(v=>v.id===x.querySelector('.sale-menu').value);if(!m)return;const q=Number(x.querySelector('.sale-qty').value||0),p=Number(x.querySelector('.sale-price').value||state.menuPrices.find(v=>v.menu_item_id===m.id)?.selling_price||0),h=recipeCost(m.recipe_id);total+=p*q;gp+=(p-h)*q});$('salePreview').innerHTML=rows.length?`<div class="metric-row"><span>Total sales</span><b>${money(total)}</b></div><div class="metric-row"><span>Gross profit</span><b>${money(gp)}</b></div><div class="metric-row"><span>Food cost</span><b>${fmt(total?((total-gp)/total*100):0)}%</b></div>`:'Tambahkan item.'}
    window.saveSale=async()=>{try{const rows=[...document.querySelectorAll('#saleRows>div')];if(!rows.length)throw Error('Tambahkan minimal satu menu');let total=0;const items=rows.map(x=>{const m=state.menu.find(v=>v.id===x.querySelector('.sale-menu').value),q=Number(x.querySelector('.sale-qty').value||0),p=Number(x.querySelector('.sale-price').value||state.menuPrices.find(v=>v.menu_item_id===m.id)?.selling_price||0),h=recipeCost(m.recipe_id);total+=p*q;return {menu_item_id:m.id,qty:q,selling_price:p,hpp_per_unit:h}});const {data,error}=await db.from('sales').insert({organization_id:state.org.id,sale_date:$('saleDate').value,source:$('saleSource').value,total_sales:total}).select().single();if(error)throw error;const er=await db.from('sale_items').insert(items.map(i=>({...i,sale_id:data.id})));if(er.error)throw er.error;toast('Sales tersimpan');$('saleRows').innerHTML='';previewSales()}catch(e){toast(e.message)}};
    async function refresh(){if(!state.session)return;const ok=await loadOrg();if(ok){await loadData();$('authView').classList.add('hide');$('appView').classList.remove('hide');renderNav();renderScreen()}}
    signupBtn.addEventListener('click',async()=>{try{signupBtn.disabled=true;setAuthOk('Mendaftarkan akun...');const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password)throw new Error('Email dan password wajib diisi.');if(password.length<6)throw new Error('Password minimal 6 karakter.');const {error}=await db.auth.signUp({email,password});if(error)throw error;setAuthOk('Akun berhasil dibuat. Cek email verifikasi bila diminta, lalu klik Masuk.')}catch(e){setAuthError(e?.message||'Pendaftaran gagal.')}finally{signupBtn.disabled=false}});
    loginBtn.addEventListener('click',async()=>{try{loginBtn.disabled=true;setAuthOk('Memproses login...');const {error}=await db.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});if(error)throw error;setAuthOk('Login berhasil.')}catch(e){setAuthError(e?.message||'Login gagal.')}finally{loginBtn.disabled=false}});
    $('logoutBtn').addEventListener('click',()=>db.auth.signOut());
    (async()=>{try{const {data}=await db.auth.getSession();state.session=data.session;if(state.session)await refresh()}catch(e){setAuthError(e?.message||'Gagal memuat sesi.')}})();
    db.auth.onAuthStateChange(async(_,s)=>{state.session=s;if(s){try{await refresh()}catch(e){setAuthError(e?.message||'Gagal memuat akun.')}}else{state.org=null;$('appView').classList.add('hide');$('authView').classList.remove('hide')}});
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',initApp);else initApp();
})();
</script></body></html>
