<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPP Studio — Food Cost Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f3ef;--panel:#fff;--ink:#1b1d1a;--muted:#72756f;--line:#e3e0d9;--accent:#1f6b4f;--accent2:#d8eadd;--danger:#b84b45;--shadow:0 8px 30px rgba(22,28,24,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink)}.app{min-height:100vh;display:grid;grid-template-columns:245px 1fr}.sidebar{background:#17211d;color:#eef5ef;padding:20px 14px;display:flex;flex-direction:column;gap:18px}.brand{font-weight:800;letter-spacing:-.03em;font-size:20px;padding:8px 10px}.brand small{display:block;color:#9fb5a8;font-size:11px;font-weight:500;margin-top:3px;letter-spacing:.02em}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#b8c8bf;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#24352e;color:#fff}.sidebar-footer{margin-top:auto;font-size:12px;color:#8ea197;padding:8px 10px}.main{padding:24px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.topbar h1{margin:0;font-size:28px;letter-spacing:-.04em}.topbar p{margin:4px 0 0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:9px 12px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.btn.ghost{background:transparent}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.kpi{font-size:26px;font-weight:800;letter-spacing:-.03em}.muted{color:var(--muted)}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-head h2{font-size:16px;margin:0}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fbfaf8}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:var(--accent2);color:var(--accent)}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted);font-weight:600}.field input,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;outline:none}.field input:focus,.field select:focus{border-color:#8ab49e;box-shadow:0 0 0 3px #dff0e5}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.empty{padding:32px;text-align:center;color:var(--muted)}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.auth-box{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:16px;padding:26px;box-shadow:var(--shadow)}.toast{position:fixed;right:18px;bottom:18px;background:#17211d;color:#fff;padding:12px 14px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:10}.drawer{position:fixed;inset:0;background:rgba(0,0,0,.2);display:none;align-items:flex-end;justify-content:flex-end;z-index:9}.drawer.open{display:flex}.drawer-panel{height:100%;width:min(600px,100%);background:#fff;padding:22px;overflow:auto}.metric-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}.metric-row:last-child{border-bottom:0}.accent{color:var(--accent)}.danger{color:var(--danger)}.notice{background:#f0f7f2;border:1px solid #d8eadf;color:#315841;padding:12px;border-radius:10px}.hide{display:none!important}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:8;flex-direction:row;align-items:center;overflow:auto}.nav{display:flex}.sidebar-footer{display:none}.main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:620px){.stats,.form-grid{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.drawer-panel{width:100%}}
</style></head>
<body>
<div id="authView" class="auth"><div class="auth-box"><div class="brand" style="color:#17211d;padding:0 0 16px">HPP Studio<small style="color:#72756f">Food Cost Management</small></div><div id="authNotice" class="notice" style="margin-bottom:14px">Masuk atau buat akun untuk mulai menggunakan database HPP.</div><div class="grid"><div class="field"><label>Email</label><input id="authEmail" type="email" placeholder="nama@email.com"></div><div class="field"><label>Password</label><input id="authPassword" type="password" placeholder="Minimal 6 karakter"></div><div class="actions"><button class="btn" id="signupBtn">Daftar</button><button class="btn primary" id="loginBtn">Masuk</button></div></div></div></div>
<div id="appView" class="app hide"><aside class="sidebar"><div class="brand">HPP Studio<small>Food Cost Management</small></div><div class="nav" id="nav"></div><div class="sidebar-footer"><div id="orgLabel">Belum ada organisasi</div><button class="btn ghost" style="color:#fff;padding:8px 0;border:0" id="logoutBtn">Keluar</button></div></aside><main class="main"><div class="topbar"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Kontrol HPP, recipe, dan margin menu.</p></div><div id="topActions"></div></div><div id="content"></div></main></div><div id="toast" class="toast"></div><div id="drawer" class="drawer"><div class="drawer-panel"><div class="topbar"><div><h2 id="drawerTitle" style="margin:0">Form</h2><p class="muted" id="drawerSubtitle"></p></div><button class="btn" onclick="closeDrawer()">Tutup</button></div><div id="drawerContent"></div></div></div>
<script>
const SUPABASE_URL='https://zcctezdfuyyhgjeajlpr.supabase.co'; const SUPABASE_KEY='sb_publishable_dgjPe3SZd1dgktnAXUxMEg_ITl9TihV'; const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const state={session:null,org:null,memberships:[],units:[],ingredients:[],prices:[],recipes:[],recipeItems:[],menu:[],menuPrices:[],packagings:[],screen:'dashboard'};
const navItems=[['dashboard','Dashboard'],['ingredients','Ingredients'],['recipes','Recipe Builder'],['calculator','HPP Calculator'],['menu','Menu Engineering']];
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0)); const fmt=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:4});
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2600)} function escapeHtml(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showAuth(msg){document.getElementById('authView').classList.remove('hide');document.getElementById('appView').classList.add('hide');if(msg)document.getElementById('authNotice').textContent=msg} function showApp(){document.getElementById('authView').classList.add('hide');document.getElementById('appView').classList.remove('hide');renderNav()}
function renderNav(){document.getElementById('nav').innerHTML=navItems.map(([id,t])=>`<button class="${state.screen===id?'active':''}" onclick="go('${id}')">${t}</button>`).join('')}
async function loadOrg(){const {data,error}=await db.from('memberships').select('id,organization_id,role,organizations(id,name,currency_code,costing_method)').eq('user_id',state.session.user.id);if(error)throw error;state.memberships=data||[];state.org=data?.[0]?.organizations||null;document.getElementById('orgLabel').textContent=state.org?.name||'Belum ada organisasi';if(!state.org){openOrgDrawer();return false}return true}
async function loadData(){if(!state.org)return;const oid=state.org.id;const [u,i,p,r,ri,m,mp,pk]=await Promise.all([db.from('units').select('*').eq('organization_id',oid).order('name'),db.from('ingredients').select('*,ingredient_categories(name),units(symbol)').eq('organization_id',oid).order('name'),db.from('ingredient_prices').select('*').eq('organization_id',oid).order('effective_date',{ascending:false}),db.from('recipes').select('*,units(symbol)').eq('organization_id',oid).order('name'),db.from('recipe_ingredients').select('*'),db.from('menu_items').select('*').eq('organization_id',oid).order('name'),db.from('menu_prices').select('*'),db.from('packagings').select('*,units(symbol)').eq('organization_id',oid).order('name')]); state.units=u.data||[];state.ingredients=i.data||[];state.prices=p.data||[];state.recipes=r.data||[];state.recipeItems=ri.data||[];state.menu=m.data||[];state.menuPrices=mp.data||[];state.packagings=pk.data||[];if(u.error||i.error||p.error||r.error||ri.error||m.error||mp.error||pk.error)toast('Sebagian data gagal dimuat')}
function unitCostForIngredient(id){const x=state.prices.filter(p=>p.ingredient_id===id)[0];if(!x)return 0;const pu=state.units.find(u=>u.id===x.purchase_unit_id);const base=state.ingredients.find(i=>i.id===id)?.base_unit_id;const bu=state.units.find(u=>u.id===base);if(!pu||!bu)return Number(x.purchase_cost)/Number(x.purchase_qty);const normalizedQty=Number(x.purchase_qty)*Number(pu.conversion_to_base);return normalizedQty?Number(x.purchase_cost)/normalizedQty:0}
function recipeCost(id){const items=state.recipeItems.filter(x=>x.recipe_id===id);return items.reduce((s,it)=>{if(!it.ingredient_id)return s;const unit=state.units.find(u=>u.id===it.unit_id);const ing=state.ingredients.find(i=>i.id===it.ingredient_id);const ubase=state.units.find(u=>u.id===ing?.base_unit_id);let q=Number(it.quantity);if(unit&&ubase&&unit.base_unit===ubase.base_unit)q*=Number(unit.conversion_to_base)/Number(ubase.conversion_to_base);return s+q*unitCostForIngredient(it.ingredient_id)},0)} function foodCost(hpp,price){return price?hpp/price*100:0}
function go(screen){state.screen=screen;renderNav();renderScreen()} function renderScreen(){const titles={dashboard:['Dashboard','Ringkasan HPP dan profitabilitas'],ingredients:['Ingredients','Master bahan baku dan histori harga'],recipes:['Recipe Builder','Bangun recipe dari bahan baku'],calculator:['HPP Calculator','Hitung HPP, food cost, dan margin'],menu:['Menu Engineering','Bandingkan harga, HPP, dan margin menu']};document.getElementById('pageTitle').textContent=titles[state.screen][0];document.getElementById('pageSubtitle').textContent=titles[state.screen][1];document.getElementById('topActions').innerHTML=state.screen==='ingredients'?'<button class="btn primary" onclick="openIngredientDrawer()">+ Bahan</button>':state.screen==='recipes'?'<button class="btn primary" onclick="openRecipeDrawer()">+ Recipe</button>':state.screen==='menu'?'<button class="btn primary" onclick="openMenuDrawer()">+ Menu</button>':'';document.getElementById('content').innerHTML=screenHtml();bindScreenActions()}
function screenHtml(){if(!state.org)return '<div class="card empty">Buat organisasi terlebih dahulu.</div>';if(state.screen==='dashboard')return dashboardHtml();if(state.screen==='ingredients')return ingredientsHtml();if(state.screen==='recipes')return recipesHtml();if(state.screen==='calculator')return calculatorHtml();return menuHtml()}
function dashboardHtml(){const avg=state.menu.length?state.menu.reduce((s,m)=>s+recipeCost(m.recipe_id),0)/state.menu.length:0;const expensive=[...state.menu].sort((a,b)=>recipeCost(b.recipe_id)-recipeCost(a.recipe_id)).slice(0,5);return `<div class="grid stats"><div class="card"><div class="label">Menu</div><div class="kpi">${state.menu.length}</div></div><div class="card"><div class="label">Ingredients</div><div class="kpi">${state.ingredients.length}</div></div><div class="card"><div class="label">Recipe</div><div class="kpi">${state.recipes.length}</div></div><div class="card"><div class="label">Avg HPP</div><div class="kpi">${money(avg)}</div></div></div><div class="section split"><div class="card"><div class="section-head"><h2>Menu dengan HPP tertinggi</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Menu</th><th>HPP</th><th>Harga</th><th>Food Cost</th></tr></thead><tbody>${expensive.length?expensive.map(m=>{const h=recipeCost(m.recipe_id),p=state.menuPrices.find(x=>x.menu_item_id===m.id);return `<tr><td>${escapeHtml(m.name)}</td><td>${money(h)}</td><td>${p?money(p.selling_price):'—'}</td><td>${p?fmt(foodCost(h,p.selling_price))+'%':'—'}</td></tr>`}).join(''):'<tr><td colspan="4" class="empty">Belum ada menu.</td></tr>'}</tbody></table></div></div><div class="card"><div class="section-head"><h2>Quick actions</h2></div><div class="grid"><button class="btn" onclick="go('ingredients')">Tambah bahan baku</button><button class="btn" onclick="go('recipes')">Bangun recipe</button><button class="btn" onclick="go('calculator')">Hitung HPP</button><button class="btn" onclick="go('menu')">Review margin menu</button></div></div></div>`}
function ingredientsHtml(){return `<div class="card"><div class="section-head"><h2>Master Ingredients</h2><span class="pill">${state.ingredients.length} item</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Unit</th><th>Unit Cost</th><th>Harga Terakhir</th><th>Status</th></tr></thead><tbody>${state.ingredients.length?state.ingredients.map(i=>{const p=state.prices.find(x=>x.ingredient_id===i.id),u=state.units.find(x=>x.id===i.base_unit_id);return `<tr><td>${escapeHtml(i.name)}</td><td>${escapeHtml(u?.symbol||'-')}</td><td>${money(unitCostForIngredient(i.id))}</td><td>${p?money(p.purchase_cost):'—'}</td><td>${i.is_active?'<span class="pill">Active</span>':'Inactive'}</td></tr>`}).join(''):'<tr><td colspan="5" class="empty">Belum ada bahan.</td></tr>'}</tbody></table></div></div>`}
function recipesHtml(){return `<div class="card"><div class="section-head"><h2>Recipes</h2><span class="pill">${state.recipes.length} recipe</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Recipe</th><th>Yield</th><th>Waste</th><th>HPP</th><th></th></tr></thead><tbody>${state.recipes.length?state.recipes.map(r=>`<tr><td>${escapeHtml(r.name)}</td><td>${fmt(r.yield_qty)} ${escapeHtml(r.units?.symbol||'')}</td><td>${fmt(r.waste_percent)}%</td><td>${money(recipeCost(r.id)*(1+Number(r.waste_percent||0)/100))}</td><td><button class="btn" onclick="viewRecipe('${r.id}')">Detail</button></td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada recipe.</td></tr>'}</tbody></table></div></div>`}
function calculatorHtml(){return `<div class="split"><div class="card"><div class="section-head"><h2>Calculator</h2></div><div class="form-grid"><div class="field full"><label>Recipe / Menu</label><select id="calcRecipe"><option value="">Pilih recipe</option>${state.recipes.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')}</select></div><div class="field"><label>Harga Jual</label><input id="calcPrice" type="number" min="0" value="30000"></div><div class="field"><label>Waste %</label><input id="calcWaste" type="number" min="0" step="0.1" value="0"></div></div><div class="actions"><button class="btn primary" onclick="runCalculator()">Hitung</button></div></div><div id="calcResult" class="card"><div class="empty">Pilih recipe lalu hitung.</div></div></div>`}
function menuHtml(){return `<div class="card"><div class="section-head"><h2>Menu Engineering</h2><span class="pill">${state.menu.length} menu</span></div><div class="table-wrap"><table class="table"><thead><tr><th>Menu</th><th>HPP</th><th>Harga</th><th>Food Cost</th><th>Gross Profit</th><th>Status</th></tr></thead><tbody>${state.menu.length?state.menu.map(m=>{const h=recipeCost(m.recipe_id),p=state.menuPrices.find(x=>x.menu_item_id===m.id),fc=p?foodCost(h,p.selling_price):0,gp=p?Number(p.selling_price)-h:0;return `<tr><td>${escapeHtml(m.name)}</td><td>${money(h)}</td><td>${p?money(p.selling_price):'—'}</td><td>${p?fmt(fc)+'%':'—'}</td><td>${p?money(gp):'—'}</td><td>${p?(fc<=30?'<span class="pill">Healthy</span>':'<span class="pill" style="background:#fff0dc;color:#a26719">Review</span>'):'—'}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Belum ada menu.</td></tr>'}</tbody></table></div></div>`}
function bindScreenActions(){}
function openDrawer(title,subtitle,html){document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerSubtitle').textContent=subtitle||'';document.getElementById('drawerContent').innerHTML=html;document.getElementById('drawer').classList.add('open')} function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
function openOrgDrawer(){openDrawer('Buat organisasi','Organisasi pertama akan menjadi workspace Anda.',`<div class="form-grid"><div class="field full"><label>Nama usaha</label><input id="orgName" placeholder="Contoh: Bigberry Resto"></div></div><div class="actions"><button class="btn primary" onclick="createOrg()">Buat Workspace</button></div>`)}
async function createOrg(){try{const name=document.getElementById('orgName').value.trim();if(!name)throw new Error('Nama usaha wajib diisi');const {data,error}=await db.from('organizations').insert({name}).select().single();if(error)throw error;const m=await db.from('memberships').insert({organization_id:data.id,user_id:state.session.user.id,role:'owner'});if(m.error)throw m.error;await seedUnits(data.id);closeDrawer();await refresh()}catch(e){toast(e.message)}}
async function seedUnits(oid){const units=[['gram','g','mass',1],['kilogram','kg','mass',1000],['milliliter','ml','volume',1],['liter','L','volume',1000],['piece','pcs','count',1],['cup','cup','count',1]];await db.from('units').insert(units.map(x=>({organization_id:oid,name:x[0],symbol:x[1],base_unit:x[2],conversion_to_base:x[3]})))}
function openIngredientDrawer(){openDrawer('Tambah Ingredient','Masukkan bahan dan harga beli terbaru.',`<div class="form-grid"><div class="field"><label>Nama</label><input id="ingName"></div><div class="field"><label>SKU</label><input id="ingSku"></div><div class="field"><label>Unit dasar</label><select id="ingUnit">${state.units.map(u=>`<option value="${u.id}">${escapeHtml(u.name)} (${escapeHtml(u.symbol)})</option>`).join('')}</select></div><div class="field"><label>Harga beli</label><input id="ingCost" type="number" min="0"></div><div class="field"><label>Qty pembelian</label><input id="ingQty" type="number" min="0" step="0.001" value="1"></div><div class="field"><label>Unit pembelian</label><select id="ingPurchaseUnit">${state.units.map(u=>`<option value="${u.id}">${escapeHtml(u.name)} (${escapeHtml(u.symbol)})</option>`).join('')}</select></div></div><div class="actions"><button class="btn primary" onclick="saveIngredient()">Simpan</button></div>`)}
async function saveIngredient(){try{const o={organization_id:state.org.id,name:document.getElementById('ingName').value.trim(),sku:document.getElementById('ingSku').value.trim()||null,base_unit_id:document.getElementById('ingUnit').value};if(!o.name)throw new Error('Nama bahan wajib diisi');const {data,error}=await db.from('ingredients').insert(o).select().single();if(error)throw error;const p={organization_id:state.org.id,ingredient_id:data.id,purchase_qty:Number(document.getElementById('ingQty').value||1),purchase_unit_id:document.getElementById('ingPurchaseUnit').value,purchase_cost:Number(document.getElementById('ingCost').value||0)};const ep=await db.from('ingredient_prices').insert(p);if(ep.error)throw ep.error;closeDrawer();await refresh();go('ingredients');toast('Ingredient tersimpan')}catch(e){toast(e.message)}}
function openRecipeDrawer(){const opts=state.ingredients.map(i=>`<option value="i:${i.id}">${escapeHtml(i.name)}</option>`).join('')+state.recipes.map(r=>`<option value="r:${r.id}">${escapeHtml(r.name)} (recipe)</option>`).join('');openDrawer('Buat Recipe','Tambahkan bahan lalu sistem menghitung HPP.',`<div class="form-grid"><div class="field full"><label>Nama Recipe</label><input id="recName" placeholder="Contoh: Es Kopi Susu Aren"></div><div class="field"><label>Yield</label><input id="recYield" type="number" value="1" min="0.001"></div><div class="field"><label>Unit Yield</label><select id="recYieldUnit">${state.units.map(u=>`<option value="${u.id}">${escapeHtml(u.symbol)}</option>`).join('')}</select></div><div class="field"><label>Waste %</label><input id="recWaste" type="number" min="0" step="0.1" value="0"></div><div class="field full"><label>Item recipe</label><div id="recipeRows"></div><button class="btn" type="button" onclick="addRecipeRow()">+ Tambah item</button></div></div><div class="actions"><button class="btn primary" onclick="saveRecipe()">Simpan Recipe</button></div>`);addRecipeRow(opts)}
function addRecipeRow(opts){const wrap=document.getElementById('recipeRows');const d=document.createElement('div');d.style.cssText='display:grid;grid-template-columns:1fr 110px 110px auto;gap:8px;margin-bottom:8px';d.innerHTML=`<select class="rr-item">${opts||state.ingredients.map(i=>`<option value="i:${i.id}">${escapeHtml(i.name)}</option>`).join('')}</select><input class="rr-qty" type="number" min="0.001" step="0.001" value="1"><select class="rr-unit">${state.units.map(u=>`<option value="${u.id}">${escapeHtml(u.symbol)}</option>`).join('')}</select><button class="btn danger" onclick="this.parentElement.remove()">×</button>`;wrap.appendChild(d)}
async function saveRecipe(){try{const name=document.getElementById('recName').value.trim();if(!name)throw new Error('Nama recipe wajib diisi');const r={organization_id:state.org.id,name,yield_qty:Number(document.getElementById('recYield').value||1),yield_unit_id:document.getElementById('recYieldUnit').value,waste_percent:Number(document.getElementById('recWaste').value||0)};const {data,error}=await db.from('recipes').insert(r).select().single();if(error)throw error;const rows=[...document.querySelectorAll('#recipeRows>div')].map((x,idx)=>{const v=x.querySelector('.rr-item').value.split(':');return {recipe_id:data.id,ingredient_id:v[0]==='i'?v[1]:null,sub_recipe_id:v[0]==='r'?v[1]:null,quantity:Number(x.querySelector('.rr-qty').value),unit_id:x.querySelector('.rr-unit').value,sort_order:idx}});if(rows.length){const er=await db.from('recipe_ingredients').insert(rows);if(er.error)throw er.error}closeDrawer();await refresh();go('recipes');toast('Recipe tersimpan')}catch(e){toast(e.message)}}
function viewRecipe(id){const r=state.recipes.find(x=>x.id===id);const items=state.recipeItems.filter(x=>x.recipe_id===id);openDrawer(r.name,'Detail recipe',`<div class="metric-row"><span>Yield</span><b>${fmt(r.yield_qty)} ${escapeHtml(r.units?.symbol||'')}</b></div><div class="metric-row"><span>Waste</span><b>${fmt(r.waste_percent)}%</b></div><div class="metric-row"><span>HPP dasar</span><b>${money(recipeCost(id))}</b></div><div class="section"><div class="label" style="margin-bottom:8px">Ingredients</div>${items.map(it=>{const ing=it.ingredient_id?state.ingredients.find(i=>i.id===it.ingredient_id):null;return `<div class="metric-row"><span>${escapeHtml(ing?.name||'Sub recipe')}</span><b>${fmt(it.quantity)} ${escapeHtml(state.units.find(u=>u.id===it.unit_id)?.symbol||'')}</b></div>`}).join('')}</div>`)}
function openMenuDrawer(){openDrawer('Tambah Menu','Hubungkan menu dengan recipe dan harga jual.',`<div class="form-grid"><div class="field full"><label>Nama Menu</label><input id="menuName"></div><div class="field full"><label>Recipe</label><select id="menuRecipe">${state.recipes.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('')}</select></div><div class="field"><label>Kategori</label><input id="menuCategory" placeholder="Coffee / Non Coffee"></div><div class="field"><label>Harga Jual</label><input id="menuPrice" type="number" min="0"></div></div><div class="actions"><button class="btn primary" onclick="saveMenu()">Simpan Menu</button></div>`)}
async function saveMenu(){try{const name=document.getElementById('menuName').value.trim();if(!name)throw new Error('Nama menu wajib diisi');const {data,error}=await db.from('menu_items').insert({organization_id:state.org.id,name,recipe_id:document.getElementById('menuRecipe').value,category:document.getElementById('menuCategory').value||null}).select().single();if(error)throw error;const price=Number(document.getElementById('menuPrice').value||0);if(price){const ep=await db.from('menu_prices').insert({menu_item_id:data.id,selling_price:price});if(ep.error)throw ep.error}closeDrawer();await refresh();go('menu');toast('Menu tersimpan')}catch(e){toast(e.message)}}
function runCalculator(){const id=document.getElementById('calcRecipe').value;if(!id)return;const r=state.recipes.find(x=>x.id===id),base=recipeCost(id),w=Number(document.getElementById('calcWaste').value||r.waste_percent||0),hpp=base*(1+w/100),price=Number(document.getElementById('calcPrice').value||0),fc=foodCost(hpp,price),gp=price-hpp;document.getElementById('calcResult').innerHTML=`<div class="label">Hasil</div><div class="kpi accent" style="margin:6px 0 14px">${money(hpp)}</div><div class="metric-row"><span>Ingredient cost</span><b>${money(base)}</b></div><div class="metric-row"><span>Waste</span><b>${fmt(w)}%</b></div><div class="metric-row"><span>Harga jual</span><b>${money(price)}</b></div><div class="metric-row"><span>Food Cost</span><b class="${fc>30?'danger':'accent'}">${fmt(fc)}%</b></div><div class="metric-row"><span>Gross Profit</span><b>${money(gp)}</b></div>`}
async function refresh(){const ok=await loadOrg();if(ok){await loadData();showApp();renderScreen()}}
document.getElementById('loginBtn').onclick=async()=>{try{const {error}=await db.auth.signInWithPassword({email:authEmail.value.trim(),password:authPassword.value});if(error)throw error}catch(e){showAuth(e.message)}};document.getElementById('signupBtn').onclick=async()=>{try{const email=authEmail.value.trim(),password=authPassword.value;if(password.length<6)throw new Error('Password minimal 6 karakter');const {data,error}=await db.auth.signUp({email,password});if(error)throw error;showAuth(data.session?'Akun dibuat.':'Akun dibuat. Cek email verifikasi bila diminta. Silakan masuk.')}catch(e){showAuth(e.message)}};document.getElementById('logoutBtn').onclick=()=>db.auth.signOut();(async()=>{const {data}=await db.auth.getSession();state.session=data.session;if(state.session){try{await refresh()}catch(e){showAuth(e.message)}}else showAuth()})();db.auth.onAuthStateChange(async(_event,session)=>{state.session=session;if(session){try{await refresh()}catch(e){showAuth(e.message)}}else showAuth()});
</script></body></html>
