<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HPP Studio — Public Calculator</title>
<style>
:root{--bg:#f5f3ef;--panel:#fff;--ink:#1b1d1a;--muted:#72756f;--line:#e1ded6;--accent:#1f6b4f;--soft:#e5f0e9;--warn:#a96b16;--danger:#a8433d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#17211d;color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:18px}.brand{font-weight:850;font-size:21px;letter-spacing:-.03em;padding:8px 10px}.brand small{display:block;color:#a9bbb1;font-size:11px;font-weight:500;letter-spacing:0;margin-top:2px}.nav{display:grid;gap:5px}.nav button{width:100%;border:0;background:transparent;color:#b9c8bf;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#25362f;color:#fff}.side-note{margin-top:auto;color:#8ea297;font-size:11px;padding:8px 10px}.main{padding:24px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}.top h1{margin:0;font-size:28px;letter-spacing:-.04em}.top p{margin:5px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 12px;border-radius:9px;cursor:pointer}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.danger{color:var(--danger)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:1.1fr .9fr}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:750}.kpi{font-size:26px;font-weight:850;letter-spacing:-.03em;margin-top:4px}.section{margin-top:16px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.section-head h2{margin:0;font-size:16px}.pill{display:inline-flex;align-items:center;background:var(--soft);color:var(--accent);padding:4px 8px;border-radius:999px;font-size:11px;font-weight:750}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fbfaf8}.table tr:last-child td{border-bottom:0}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:none}input:focus,select:focus{border-color:#8db6a2;box-shadow:0 0 0 3px #e1efe7}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line)}.metric:last-child{border-bottom:0}.notice{padding:12px;border:1px solid #d6e8dc;background:#f0f7f2;color:#315841;border-radius:10px}.warn{background:#fff6e8;border-color:#eed7af;color:#88540f}.empty{text-align:center;padding:28px;color:var(--muted)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.2);display:none;align-items:flex-end;justify-content:flex-end}.modal.open{display:flex}.panel{height:100%;width:min(620px,100%);background:#fff;padding:22px;overflow:auto}.row{display:grid;grid-template-columns:1fr 110px 110px auto;gap:8px;margin-bottom:8px}.small{font-size:11px;color:var(--muted)}@media(max-width:980px){.app{grid-template-columns:1fr}.sidebar{position:sticky;top:0;z-index:5;flex-direction:row;align-items:center;overflow:auto}.nav{display:flex}.side-note{display:none}.main{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}}@media(max-width:600px){.stats,.form-grid{grid-template-columns:1fr}.top{flex-direction:column}.row{grid-template-columns:1fr 90px 90px auto}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand">HPP Studio<small>Public HPP & Food Cost Calculator</small></div><div class="nav" id="nav"></div><div class="side-note">Mode publik · Data tersimpan di browser perangkat ini.</div></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><p id="subtitle">Kalkulator HPP tanpa login.</p></div><div class="actions"><button class="btn" id="resetBtn">Reset Data</button></div></div><div id="content"></div></main></div>
<div class="modal" id="modal"><div class="panel"><div class="top"><div><h2 id="modalTitle" style="margin:0"></h2><p id="modalSub" class="small"></p></div><button class="btn" id="closeModal">Tutup</button></div><div id="modalBody"></div></div></div>
<script>
const KEY='hpp_public_v1';
const defaultState={ingredients:[],recipes:[],menus:[],sales:[],stock:[]};
const state=loadState();let screen='dashboard';
const nav=[['dashboard','Dashboard'],['ingredients','Ingredients'],['recipes','Recipe Builder'],['calculator','HPP Calculator'],['menu','Menu Engineering'],['stock','Stock Opname'],['sales','Sales']];
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(n||0));
const num=n=>Number(n||0).toLocaleString('id-ID',{maximumFractionDigits:4});
const esc=s=>String(s??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;'}[c]));
function loadState(){try{return {...defaultState,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{return {...defaultState}}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));render()}
function setScreen(s){screen=s;render()}
function renderNav(){$('nav').innerHTML=nav.map(([id,label])=>`<button class="${screen===id?'active':''}" onclick="setScreen('${id}')">${label}</button>`).join('')}
function render(){renderNav();const t={dashboard:['Dashboard','Kalkulator HPP tanpa login.'],ingredients:['Ingredients','Master bahan baku dan biaya per unit.'],recipes:['Recipe Builder','Susun recipe, yield, waste, dan HPP.'],calculator:['HPP Calculator','Hitung HPP, food cost, dan gross profit.'],menu:['Menu Engineering','Bandingkan HPP dan margin menu.'],stock:['Stock Opname','Catat stok fisik secara lokal.'],sales:['Sales','Catat penjualan dan gross profit.']}[screen];$('title').textContent=t[0];$('subtitle').textContent=t[1];$('content').innerHTML=views[screen]();}
function unitCost(i){if(!i)return 0;return Number(i.cost||0)/Math.max(Number(i.purchaseQty||1),.000001)}
function recipeCost(r){if(!r)return 0;return (r.items||[]).reduce((s,x)=>{const i=state.ingredients.find(v=>v.id===x.ingredientId);return s+unitCost(i)*Number(x.qty||0)},0)}
function finalHpp(r,waste){const base=recipeCost(r);return base*(1+Number(waste ?? r?.waste ?? 0)/100)}
const views={
dashboard:()=>{const avg=state.menus.length?state.menus.reduce((s,m)=>s+finalHpp(state.recipes.find(r=>r.id===m.recipeId)),0)/state.menus.length:0;const top=[...state.menus].sort((a,b)=>finalHpp(state.recipes.find(r=>r.id===b.recipeId))-finalHpp(state.recipes.find(r=>r.id===a.recipeId))).slice(0,5);return `<div class="grid stats"><div class="card"><div class="label">Ingredients</div><div class="kpi">${state.ingredients.length}</div></div><div class="card"><div class="label">Recipes</div><div class="kpi">${state.recipes.length}</div></div><div class="card"><div class="label">Menus</div><div class="kpi">${state.menus.length}</div></div><div class="card"><div class="label">Average HPP</div><div class="kpi">${money(avg)}</div></div></div><div class="section split grid"><div class="card"><div class="section-head"><h2>Menu HPP tertinggi</h2></div>${top.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Menu</th><th>HPP</th><th>Harga</th><th>Food Cost</th></tr></thead><tbody>${top.map(m=>{const r=state.recipes.find(v=>v.id===m.recipeId),h=finalHpp(r);const fc=m.price?h/m.price*100:0;return `<tr><td>${esc(m.name)}</td><td>${money(h)}</td><td>${money(m.price)}</td><td>${num(fc)}%</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Belum ada menu.</div>'}</div><div class="card"><div class="section-head"><h2>Quick Start</h2></div><div class="grid"><button class="btn primary" onclick="setScreen('ingredients')">+ Tambah Ingredient</button><button class="btn" onclick="setScreen('recipes')">+ Buat Recipe</button><button class="btn" onclick="setScreen('calculator')">Buka Calculator</button><button class="btn" onclick="setScreen('menu')">Review Menu</button></div></div></div>`},
ingredients:()=>`<div class="card"><div class="section-head"><h2>Master Ingredients</h2><button class="btn primary" onclick="openIngredient()">+ Bahan</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Nama</th><th>Unit</th><th>Harga Beli</th><th>Qty Beli</th><th>Unit Cost</th></tr></thead><tbody>${state.ingredients.length?state.ingredients.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${money(i.cost)}</td><td>${num(i.purchaseQty)}</td><td>${money(unitCost(i))}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada bahan.</td></tr>'}</tbody></table></div></div>`,
recipes:()=>`<div class="card"><div class="section-head"><h2>Recipe Builder</h2><button class="btn primary" onclick="openRecipe()">+ Recipe</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Recipe</th><th>Yield</th><th>Waste</th><th>Ingredient Cost</th><th>Final HPP</th></tr></thead><tbody>${state.recipes.length?state.recipes.map(r=>`<tr><td>${esc(r.name)}</td><td>${num(r.yield)} ${esc(r.yieldUnit)}</td><td>${num(r.waste)}%</td><td>${money(recipeCost(r))}</td><td>${money(finalHpp(r))}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada recipe.</td></tr>'}</tbody></table></div></div>`,
calculator:()=>`<div class="split grid"><div class="card"><div class="section-head"><h2>Calculator</h2></div><div class="form-grid"><div class="field full"><label>Recipe</label><select id="calcRecipe"><option value="">Pilih recipe</option>${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Harga Jual</label><input id="calcPrice" type="number" min="0" value="30000"></div><div class="field"><label>Waste %</label><input id="calcWaste" type="number" min="0" step="0.1" value="0"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="calculate()">Hitung HPP</button></div></div><div id="calcResult" class="card"><div class="empty">Pilih recipe, lalu hitung.</div></div></div>`,
menu:()=>`<div class="card"><div class="section-head"><h2>Menu Engineering</h2><button class="btn primary" onclick="openMenu()">+ Menu</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Menu</th><th>Recipe</th><th>HPP</th><th>Harga</th><th>Food Cost</th><th>Gross Profit</th></tr></thead><tbody>${state.menus.length?state.menus.map(m=>{const r=state.recipes.find(x=>x.id===m.recipeId),h=finalHpp(r),fc=m.price?h/m.price*100:0,gp=m.price-h;return `<tr><td>${esc(m.name)}</td><td>${esc(r?.name||'')}</td><td>${money(h)}</td><td>${money(m.price)}</td><td>${num(fc)}%</td><td>${money(gp)}</td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Belum ada menu.</td></tr>'}</tbody></table></div></div>`,
stock:()=>`<div class="card"><div class="section-head"><h2>Stock Opname Lokal</h2><button class="btn primary" onclick="openStock()">+ Opname</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Ingredient</th><th>System</th><th>Fisik</th><th>Variance</th></tr></thead><tbody>${state.stock.length?state.stock.map(s=>`<tr><td>${esc(s.date)}</td><td>${esc(s.ingredient)}</td><td>${num(s.systemQty)}</td><td>${num(s.countedQty)}</td><td>${num(Number(s.countedQty)-Number(s.systemQty))}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada opname.</td></tr>'}</tbody></table></div></div>`,
sales:()=>{const total=state.sales.reduce((s,x)=>s+Number(x.qty)*Number(x.price),0);const gp=state.sales.reduce((s,x)=>s+(Number(x.price)-Number(x.hpp))*Number(x.qty),0);return `<div class="split grid"><div class="card"><div class="section-head"><h2>Sales</h2><button class="btn primary" onclick="openSale()">+ Sales</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Tanggal</th><th>Menu</th><th>Qty</th><th>Sales</th><th>Gross Profit</th></tr></thead><tbody>${state.sales.length?state.sales.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.menu)}</td><td>${num(x.qty)}</td><td>${money(x.qty*x.price)}</td><td>${money((x.price-x.hpp)*x.qty)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Belum ada sales.</td></tr>'}</tbody></table></div></div><div class="card"><div class="metric"><span>Total Sales</span><b>${money(total)}</b></div><div class="metric"><span>Gross Profit</span><b>${money(gp)}</b></div><div class="metric"><span>Food Cost</span><b>${num(total?((total-gp)/total*100):0)}%</b></div></div></div>`}
};
function openModal(title,sub,body){$('modalTitle').textContent=title;$('modalSub').textContent=sub||'';$('modalBody').innerHTML=body;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}$('closeModal').onclick=closeModal;
function openIngredient(){openModal('Tambah Ingredient','Data tersimpan lokal di perangkat ini.',`<div class="form-grid"><div class="field full"><label>Nama</label><input id="iName"></div><div class="field"><label>Unit pembelian</label><select id="iUnit"><option>g</option><option>kg</option><option>ml</option><option>L</option><option>pcs</option></select></div><div class="field"><label>Qty pembelian</label><input id="iQty" type="number" min="0.001" value="1"></div><div class="field"><label>Total harga beli</label><input id="iCost" type="number" min="0"></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveIngredient()">Simpan</button></div>`)}
function saveIngredient(){state.ingredients.push({id:crypto.randomUUID(),name:$('iName').value.trim(),unit:$('iUnit').value,purchaseQty:Number($('iQty').value||1),cost:Number($('iCost').value||0)});closeModal();save();setScreen('ingredients')}
function openRecipe(){const options=state.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('');openModal('Buat Recipe','Tambahkan bahan lalu sistem menghitung HPP.',`<div class="form-grid"><div class="field full"><label>Nama Recipe</label><input id="rName"></div><div class="field"><label>Yield</label><input id="rYield" type="number" min="0.001" value="1"></div><div class="field"><label>Yield Unit</label><select id="rUnit"><option>pcs</option><option>ml</option><option>g</option><option>L</option></select></div><div class="field"><label>Waste %</label><input id="rWaste" type="number" min="0" step="0.1" value="0"></div><div class="field full"><label>Ingredient</label><div id="rRows"></div><button class="btn" onclick="addRecipeRow()">+ Tambah Ingredient</button></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="saveRecipe()">Simpan Recipe</button></div>`);addRecipeRow()}
function addRecipeRow(){const d=document.createElement('div');d.className='row';d.innerHTML=`<select class="ri">${state.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select><input class="rq" type="number" min="0.001" step="0.001" value="1"><input class="ru" value="g"><button class="btn danger" onclick="this.parentElement.remove()">×</button>`;$('rRows').appendChild(d)}
function saveRecipe(){const r={id:crypto.randomUUID(),name:$('rName').value.trim(),yield:Number($('rYield').value||1),yieldUnit:$('rUnit').value,waste:Number($('rWaste').value||0),items:[...document.querySelectorAll('#rRows .row')].map(x=>({ingredientId:x.querySelector('.ri').value,qty:Number(x.querySelector('.rq').value||0),unit:x.querySelector('.ru').value}))};if(!r.name||!r.items.length)return;state.recipes.push(r);closeModal();save();setScreen('recipes')}
function calculate(){const r=state.recipes.find(x=>x.id===$('calcRecipe').value);if(!r)return;const base=recipeCost(r),w=Number($('calcWaste').value||0),hpp=finalHpp(r,w),price=Number($('calcPrice').value||0),fc=price?hpp/price*100:0,gp=price-hpp;$('calcResult').innerHTML=`<div class="label">Final HPP</div><div class="kpi">${money(hpp)}</div><div class="metric"><span>Ingredient Cost</span><b>${money(base)}</b></div><div class="metric"><span>Waste</span><b>${num(w)}%</b></div><div class="metric"><span>Harga Jual</span><b>${money(price)}</b></div><div class="metric"><span>Food Cost</span><b class="${fc>30?'warn':''}">${num(fc)}%</b></div><div class="metric"><span>Gross Profit</span><b>${money(gp)}</b></div>`}
function openMenu(){openModal('Tambah Menu','Hubungkan menu dengan recipe dan harga jual.',`<div class="form-grid"><div class="field full"><label>Nama Menu</label><input id="mName"></div><div class="field full"><label>Recipe</label><select id="mRecipe">${state.recipes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('')}</select></div><div class="field"><label>Harga Jual</label><input id="mPrice" type="number" min="0"></div></div><div class="actions"><button class="btn primary" onclick="saveMenu()">Simpan</button></div>`)}
function saveMenu(){const r={id:crypto.randomUUID(),name:$('mName').value.trim(),recipeId:$('mRecipe').value,price:Number($('mPrice').value||0)};if(!r.name)return;state.menus.push(r);closeModal();save();setScreen('menu')}
function openStock(){openModal('Stock Opname','Catatan stok lokal.',`<div class="form-grid"><div class="field"><label>Tanggal</label><input id="sDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Ingredient</label><select id="sIng">${state.ingredients.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`).join('')}</select></div><div class="field"><label>Stok Sistem</label><input id="sSys" type="number" value="0"></div><div class="field"><label>Stok Fisik</label><input id="sCount" type="number" value="0"></div></div><div class="actions"><button class="btn primary" onclick="saveStock()">Simpan</button></div>`)}
function saveStock(){const i=state.ingredients.find(x=>x.id===$('sIng').value);state.stock.push({id:crypto.randomUUID(),date:$('sDate').value,ingredient:i?.name||'',systemQty:Number($('sSys').value||0),countedQty:Number($('sCount').value||0)});closeModal();save();setScreen('stock')}
function openSale(){openModal('Tambah Sales','Catatan penjualan lokal.',`<div class="form-grid"><div class="field"><label>Tanggal</label><input id="aDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Menu</label><select id="aMenu">${state.menus.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join('')}</select></div><div class="field"><label>Qty</label><input id="aQty" type="number" min="1" value="1"></div><div class="field"><label>Harga Aktual</label><input id="aPrice" type="number" min="0"></div></div><div class="actions"><button class="btn primary" onclick="saveSale()">Simpan</button></div>`)}
function saveSale(){const m=state.menus.find(x=>x.id===$('aMenu').value),r=state.recipes.find(x=>x.id===m?.recipeId);state.sales.push({id:crypto.randomUUID(),date:$('aDate').value,menu:m?.name||'',qty:Number($('aQty').value||1),price:Number($('aPrice').value||m?.price||0),hpp:finalHpp(r)});closeModal();save();setScreen('sales')}
$('resetBtn').onclick=()=>{if(confirm('Hapus semua data lokal HPP Studio dari browser ini?')){localStorage.removeItem(KEY);location.reload()}};
render();
</script>
</body>
</html>
